# CraScraper — demo. Shared Postgres: fybud-postgres on fybud-net (root docker-compose.db.yml).

name: crascraper-demo

services:
  backend:
    image: fiberai/crascraper-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4400}:4000"
    networks: [fybud-net]

  frontend:
    image: fiberai/crascraper-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-9400}:80"
    depends_on: [backend]
    networks: [fybud-net]

networks:
  fybud-net:
    name: fybud-net
    external: true
