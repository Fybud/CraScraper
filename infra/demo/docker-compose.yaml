# CraScraper — demo tenant (image-only).
# Domains: crascraper.fybud.com / api.crascraper.fybud.com
# Shared Postgres: user=password=crascraper-demo
# Nginx: infra/demo/nginx/crascraper.fybud.com.conf (installed on first deploy).
# RabbitMQ + crawler optional — uncomment the block below to enable collection.

name: crascraper-demo

services:
  backend:
    image: fiberai/crascraper-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4400}:4000"
    networks: [fiberai-net]

  frontend:
    image: fiberai/crascraper-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-9400}:80"
    depends_on: [backend]
    networks: [fiberai-net]

