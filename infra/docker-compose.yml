# CraScraper — public frontend/api. Crawler/queue stay private if added later.
name: crascraper

services:
  backend:
    image: fybud/crascraper-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4000"
    labels:
      fybud.expose: "true"
      fybud.domain: api.crascraper.fybud.com
      fybud.health: "/api/health"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]

  frontend:
    image: fybud/crascraper-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"
    labels:
      fybud.expose: "true"
      fybud.domain: crascraper.fybud.com
      fybud.health: "/"
    depends_on: [backend]
    networks: [internal]

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
