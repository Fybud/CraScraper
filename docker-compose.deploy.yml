# CraScraper — public frontend/api.
# Only Deploy-injected: IMAGE_TAG + *_HOST_PORT. Everything else = paste (.env.deploy).
name: crascraper

services:
  backend:
    image: fybud/crascraper-api:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT:
      NODE_ENV:
      JWT_SECRET:
      SEED_EMAIL:
      SEED_PASSWORD:
      TARGET_QUALIFIED:
      STALE_AFTER_HOURS:
      RABBITMQ_URL:
      DATABASE_URL:
      CORS_ORIGIN:
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4000"
    labels:
      fybud.expose: "true"
      fybud.domain: api.crascraper.fybud.com
      fybud.role: api
      fybud.health: "/api/health"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]

  frontend:
    image: fybud/crascraper-web:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"
    labels:
      fybud.expose: "true"
      fybud.domain: crascraper.fybud.com
      fybud.role: web
      fybud.health: "any"
    depends_on: [backend]
    networks: [internal]

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
