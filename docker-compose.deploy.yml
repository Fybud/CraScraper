# CraScraper — public frontend/api. Crawler/queue stay private if added later.
name: crascraper

services:
  backend:
    image: fybud/crascraper-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4000
      NODE_ENV: production
      # Empty = paste in Deploy UI. Literal = fixed here. ${VAR:?…} = Deploy-injected.
      JWT_SECRET:
      SEED_EMAIL:
      SEED_PASSWORD:
      TARGET_QUALIFIED:
      STALE_AFTER_HOURS:
      RABBITMQ_URL:
      # Deploy-injected — never pasted.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN required}
    ports:
      - "127.0.0.1:${API_HOST_PORT}:4000"
    labels:
      fybud.expose: "true"
      fybud.domain: api.crascraper.fybud.com
      fybud.role: api
      fybud.health: "/api/health"
    healthcheck:
      # node:alpine — use Node fetch (image has no curl package).
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fybud-net, internal]

  frontend:
    image: fybud/crascraper-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"
    labels:
      fybud.expose: "true"
      fybud.domain: crascraper.fybud.com
      fybud.role: web
      fybud.health: "/"
    depends_on: [backend]
    networks: [internal]

networks:
  fybud-net:
    name: fybud-net
    external: true
  internal:
    driver: bridge
